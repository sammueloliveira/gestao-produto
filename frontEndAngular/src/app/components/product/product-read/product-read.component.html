<div class="mat-elevation-z4">
  <table mat-table [dataSource]="dataSource" matSort>

    <ng-container matColumnDef="codigo">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Código</th>
      <td mat-cell *matCellDef="let row">{{ row.codigo }}</td>
    </ng-container>


    <ng-container matColumnDef="descricao">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Descrição</th>
      <td mat-cell *matCellDef="let row">{{ row.descricao }}</td>
    </ng-container>


    <ng-container matColumnDef="departamentos">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Departamento</th>
      <td mat-cell *matCellDef="let row">{{ row.departamentos.codigo }} - {{ row.departamentos.descricao }}</td>
  </ng-container>

   
    <ng-container matColumnDef="preco">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Preço</th>
      <td mat-cell *matCellDef="let row">{{ row.preco | currency: 'BRL' }}</td>
    </ng-container>

    
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
      <td mat-cell *matCellDef="let row">{{ row.status ? 'Ativo' : 'Inativo' }}</td>
    </ng-container>

   
    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef>Ações</th>
      <td mat-cell *matCellDef="let product">
        <a [routerLink]="['/products', 'detail', product.id]" class="detail">
          <i class="material-icons">info</i>
        </a>
        <a [routerLink]="['/products', 'update', product.id]" class="edit">
          <i class="material-icons">edit</i>
        </a>
        <a (click)="deleteProduct(product.id)" class="delete">
          <i class="material-icons">delete</i>
        </a>
      </td>
    </ng-container>

 
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>


  <mat-paginator 
    #paginator
    [length]="dataSource.data.length"
    [pageIndex]="0"
    [pageSize]="5"
    [pageSizeOptions]="[5]"
    aria-label="Selecionar página">
  </mat-paginator>
</div>
